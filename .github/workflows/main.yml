name: Deploy Vue Frontend to Personal PC

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_BASE_URL }}
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FRONTEND_URL: ${{ secrets.VITE_FRONTEND_URL }}

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.PC_SSH_KEY }}" > ~/.ssh/pc_key
          chmod 600 ~/.ssh/pc_key
          ssh-keyscan -H ${{ secrets.PC_SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Upload build files to PC
        run: |
          ssh -i ~/.ssh/pc_key -o StrictHostKeyChecking=no \
            ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }} \
            "mkdir -p ~/blueming/frontend && rm -rf ~/blueming/frontend/*"

          scp -i ~/.ssh/pc_key \
            -o StrictHostKeyChecking=no \
            -r dist/* \
            ${{ secrets.PC_SSH_USER }}@${{ secrets.PC_SSH_HOST }}:~/blueming/frontend/

      - name: Finalize Deployment
        run: |
          echo "배포 완료 — Docker 볼륨으로 자동 반영됩니다."

      - name: Cleanup SSH Key
        if: always()
        run: rm -f ~/.ssh/pc_key
